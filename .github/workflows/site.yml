name: Atualizar site

# De hora em hora: banidas (só faz algo quando sai o arquivo diário), preços do market e fazendas à venda.
# O site é publicado direto no GitHub Pages; no repositório só entra o histórico (no máximo 1x por dia),
# para ele não crescer à toa. Se uma parte falhar, as outras publicam mesmo assim e a rodada fica
# marcada com erro no final (o GitHub avisa por e-mail).

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repositorio
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    # memória maior para ler o arquivo diário (o GitHub não aceita mais NODE_OPTIONS via $GITHUB_ENV)
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recuperar dados da rodada anterior
        uses: actions/cache/restore@v4
        with:
          path: |
            estado/venda.json.gz
            estado/sfl-trades.json.gz
            estado/sfl-carteiras.json
            estado/sfl-fazendas.json
            docs/data/precos/agora.json
            docs/data/precos/cotacoes.json
            docs/data/venda/fazendas.json
            docs/data/sfl/trades.json
            docs/data/sfl/carteiras.json
            docs/data/ranking/oficial.json
            docs/data/ranking/completo.json
          key: vivo-${{ github.run_id }}
          restore-keys: vivo-

      - name: Ranking da temporada
        id: ranking
        continue-on-error: true
        run: node ranking.mjs
        env:
          SFL_API_KEY: ${{ secrets.SFL_API_KEY }}

      - name: Banidas
        id: banidas
        continue-on-error: true
        run: node coletar.mjs
        env:
          SFL_API_KEY: ${{ secrets.SFL_API_KEY }}

      - name: Precos do market
        id: precos
        continue-on-error: true
        run: node precos.mjs
        env:
          SFL_API_KEY: ${{ secrets.SFL_API_KEY }}

      - name: Fazendas a venda
        id: venda
        continue-on-error: true
        run: node venda.mjs
        env:
          SFL_API_KEY: ${{ secrets.SFL_API_KEY }}
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}

      - name: Terminal SFL
        id: sfl
        continue-on-error: true
        run: node sfl.mjs
        env:
          SFL_API_KEY: ${{ secrets.SFL_API_KEY }}
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}

      - name: Guardar dados para a proxima rodada
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            estado/venda.json.gz
            estado/sfl-trades.json.gz
            estado/sfl-carteiras.json
            estado/sfl-fazendas.json
            docs/data/precos/agora.json
            docs/data/precos/cotacoes.json
            docs/data/venda/fazendas.json
            docs/data/sfl/trades.json
            docs/data/sfl/carteiras.json
            docs/data/ranking/oficial.json
            docs/data/ranking/completo.json
          key: vivo-${{ github.run_id }}

      - name: Salvar o historico no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # dados "ao vivo" não ficam no repositório (vão só para o site)
          git rm -r -q --cached --ignore-unmatch docs/data/precos/agora.json docs/data/precos/flower.json docs/data/precos/cotacoes.json docs/data/venda docs/data/sfl docs/data/ranking
          for p in docs/data/dias.json docs/data/novas estado/ultimo.json.gz estado/precos estado/precos-cotacoes.json estado/ranking-ticket.txt docs/data/precos/mes .gitignore; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          # caches das fazendas e do terminal: só 1x por dia (no dia em que o arquivo do jogo foi relido)
          if [ -n "$(git status --porcelain estado/venda-dia.txt)" ]; then
            for p in estado/venda-dia.txt estado/venda.json.gz estado/sfl-trades.json.gz estado/sfl-carteiras.json estado/sfl-fazendas.json; do
              if [ -e "$p" ]; then git add "$p"; fi
            done
          fi
          git diff --cached --quiet && exit 0
          git commit -m "historico $(date -u +%F\ %H:%M)"
          # os dados "ao vivo" alterados ficam de lado durante a sincronização (--autostash)
          ok=0
          for t in 1 2 3; do
            if git pull --rebase --autostash && git push; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then echo "não consegui salvar o histórico"; exit 1; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publicar o site
        id: publicar
        uses: actions/deploy-pages@v4

      - name: Conferir se alguma parte falhou
        if: steps.ranking.outcome == 'failure' || steps.banidas.outcome == 'failure' || steps.precos.outcome == 'failure' || steps.venda.outcome == 'failure' || steps.sfl.outcome == 'failure'
        run: |
          echo "ranking: ${{ steps.ranking.outcome }} | banidas: ${{ steps.banidas.outcome }} | precos: ${{ steps.precos.outcome }} | fazendas: ${{ steps.venda.outcome }} | terminal: ${{ steps.sfl.outcome }}"
          exit 1
