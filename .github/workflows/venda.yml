name: Coletar fazendas a venda

on:
  schedule:
    - cron: "40 1,7,13,19 * * *"   # 4x por dia; a de 01:40 UTC já pega o arquivo diário do jogo (sai ~22:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repositorio   # uma rotina por vez escrevendo no repositório
  cancel-in-progress: false

jobs:
  venda:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Coletar anuncios e conferir as fazendas
        run: node venda.mjs
        env:
          SFL_API_KEY: ${{ secrets.SFL_API_KEY }}
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
      - name: Salvar o resultado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/venda estado/venda.json.gz
          git diff --cached --quiet && exit 0
          git commit -m "venda $(date -u +%F\ %H:%M)"
          git pull --rebase
          git push
