<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sunflower Land - Ranking da Temporada</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#0a0d13; --card:#131823; --card2:#181e2b; --line:#232b3a; --text:#eef1f6; --muted:#8d97a8; --faint:#5d6778;
    --c:#f2b34a; --c-soft:rgba(242,179,74,.14); --sel:#f6f7f9; --sel-text:#0a0d13; --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25); }
  body.light { --bg:#f3f5f8; --card:#fff; --card2:#f7f8fa; --line:#e2e6ec; --text:#141821; --muted:#5e6776; --faint:#8b94a3;
    --c:#b7790f; --c-soft:rgba(183,121,15,.10); --sel:#141821; --sel-text:#fff; --shadow:0 1px 2px rgba(16,24,40,.05), 0 6px 18px rgba(16,24,40,.05); }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; color:var(--text); font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:14px;
    background:radial-gradient(1100px 460px at 15% -10%, var(--c-soft), transparent 60%), var(--bg); }
  .wrap { max-width:980px; margin:0 auto; padding:24px 16px 48px; display:grid; gap:18px; }
  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .logo { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; background:var(--c-soft); font-size:22px; }
  h1 { margin:0; font-size:22px; font-weight:800; letter-spacing:-.02em; }
  .sub { color:var(--muted); font-size:12.5px; margin-top:2px; }
  .spacer { flex:1; }
  nav a { color:var(--muted); text-decoration:none; font-weight:600; font-size:13px; padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); }
  nav a:hover { color:var(--text); }
  .icon-btn { border:1px solid var(--line); background:var(--card); color:var(--muted); width:38px; height:38px; border-radius:10px; cursor:pointer; font-size:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow); min-width:0; }
  .barra { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .seg { display:inline-flex; background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:4px; gap:2px; }
  .seg button { border:0; background:transparent; color:var(--muted); font:inherit; font-weight:600; font-size:13px; padding:7px 14px; border-radius:9px; cursor:pointer; }
  .seg button.on { background:var(--sel); color:var(--sel-text); }
  input[type=search] { flex:1; min-width:180px; background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:9px 12px; font:inherit; }
  .nota { color:var(--muted); font-size:12.5px; line-height:1.55; margin:0 0 12px; }
  .nota b { color:var(--text); }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:11.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap; font-variant-numeric:tabular-nums; }
  tbody tr:hover td { background:var(--card2); }
  .r { text-align:right; }
  .pos { color:var(--faint); font-weight:700; width:56px; }
  .pos.top3 { color:var(--c); }
  .nome { font-weight:600; }
  .fid { color:var(--muted); }
  .tk { color:var(--c); font-weight:700; }
  .mais { margin-top:12px; text-align:center; }
  .mais button { border:1px solid var(--line); background:var(--card2); color:var(--text); font:inherit; font-weight:600; padding:8px 16px; border-radius:10px; cursor:pointer; }
  .vazio { color:var(--muted); padding:24px 4px; text-align:center; }
  footer { color:var(--faint); font-size:12.5px; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🏆</div>
    <div>
      <h1>Sunflower Land - Ranking da Temporada</h1>
      <div class="sub" id="sub">Carregando…</div>
    </div>
    <div class="spacer"></div>
    <nav><a href="../">← Início</a></nav>
    <button class="icon-btn" title="Trocar tema" onclick="trocarTema()">◐</button>
  </header>

  <div class="card">
    <div class="barra">
      <div class="seg">
        <button id="b-of" class="on" onclick="aba('oficial')">Top 50 oficial</button>
        <button id="b-co" onclick="aba('completo')">Ranking completo</button>
      </div>
      <input type="search" id="busca" placeholder="Buscar jogador ou Farm ID" oninput="desenhar()" />
    </div>
    <p class="nota" id="nota"></p>
    <div class="scroll"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
    <div class="mais" id="mais"></div>
  </div>

  <footer>Fonte: Community API e arquivo diário oficial do Sunflower Land. O top 50 atualiza de hora em hora; o ranking completo, uma vez por dia (~22h UTC). Não é um site oficial do jogo.</footer>
</div>
<script>
let tema = "dark"; try { tema = localStorage.getItem("sfl_ban_tema") || "dark"; } catch {}
document.body.classList.toggle("light", tema === "light");
function trocarTema() { tema = tema === "light" ? "dark" : "light"; document.body.classList.toggle("light", tema === "light"); try { localStorage.setItem("sfl_ban_tema", tema); } catch {} }

const $ = (id) => document.getElementById(id);
const j = (u) => fetch(u + "?v=" + Math.floor(Date.now() / 3e5)).then((r) => r.ok ? r.json() : null).catch(() => null);
const int = (v) => Number(v).toLocaleString("pt-BR");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function xp(v) {
  v = Number(v) || 0;
  if (v >= 1e9) return (v / 1e9).toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " bi";
  if (v >= 1e6) return (v / 1e6).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mi";
  if (v >= 1e3) return (v / 1e3).toLocaleString("pt-BR", { maximumFractionDigits: 0 }) + " mil";
  return int(Math.round(v));
}
function ha(ms) {
  const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
  if (m < 60) return `há ${m} min`;
  const h = Math.round(m / 60); return h < 48 ? `há ${h} h` : `há ${Math.round(h / 24)} dias`;
}

let OF = null, CO = null, modo = "oficial", limite = 100;
try { if (localStorage.getItem("sfl_ranking_aba") === "completo") modo = "completo"; } catch {}

function aba(m) {
  modo = m; limite = 100;
  try { localStorage.setItem("sfl_ranking_aba", m); } catch {}
  desenhar();
}

function desenhar() {
  $("b-of").classList.toggle("on", modo === "oficial");
  $("b-co").classList.toggle("on", modo === "completo");
  const q = $("busca").value.trim().toLowerCase();
  const casa = (nome, fid) => !q || String(nome).toLowerCase().includes(q) || String(fid).includes(q);
  const tk = esc((OF && OF.ticket) || (CO && CO.ticket) || "tickets");
  let linhas = [], html = "";

  if (modo === "oficial") {
    $("nota").innerHTML = OF
      ? `Ranking oficial do jogo, atualizado ${ha(OF.atualizado)}. Empate em ${tk}: vence a <b>maior ascensão</b> e, depois, o <b>maior XP</b>.`
      : "O ranking oficial ainda não foi coletado.";
    $("th").innerHTML = `<tr><th>#</th><th>Jogador</th><th>Farm ID</th><th class="r">${tk}</th><th class="r">Ascensão</th><th class="r">XP</th></tr>`;
    linhas = (OF?.top || []).map((x, i) => [i + 1, ...x]).filter((x) => casa(x[1], x[2]));
    html = linhas.map(([p, nome, fid, n, x, asc]) =>
      `<tr><td class="pos${p <= 3 ? " top3" : ""}">${p}º</td><td class="nome">${esc(nome)}</td><td class="fid">${fid}</td><td class="r tk">${int(n)}</td><td class="r">${asc == null ? "—" : "A" + asc}</td><td class="r" title="${int(Math.round(x))} XP">${xp(x)}</td></tr>`).join("");
    $("mais").innerHTML = "";
  } else {
    $("nota").innerHTML = CO
      ? `Todos os ${int(CO.lista.length)} jogadores com ${tk} no arquivo diário de ${CO.dia.split("-").reverse().join("/")}. <b>Posição estimada</b>: o arquivo é do fim do dia anterior e o contador da fazenda não inclui alguns bônus, então os números ficam abaixo do ranking oficial (cerca de 200 a 300). A ascensão não vem nos dados públicos, por isso o desempate aqui é só pelo XP.`
      : "O ranking completo sai junto com o próximo arquivo diário do jogo (~22h UTC).";
    $("th").innerHTML = `<tr><th>#</th><th>Jogador</th><th>Farm ID</th><th class="r">${tk} coletados</th><th class="r">XP</th></tr>`;
    linhas = (CO?.lista || []).map((x, i) => [i + 1, ...x]).filter((x) => casa(x[1], x[2]));
    html = linhas.slice(0, limite).map(([p, nome, fid, n, x]) =>
      `<tr><td class="pos${p <= 3 ? " top3" : ""}">${p}º</td><td class="nome">${esc(nome) || "<span class='fid'>sem nome</span>"}</td><td class="fid">${fid}</td><td class="r tk">${int(n)}</td><td class="r" title="${int(x)} XP">${xp(x)}</td></tr>`).join("");
    $("mais").innerHTML = linhas.length > limite ? `<button onclick="limite+=200;desenhar()">Mostrar mais (${int(linhas.length - limite)} restantes)</button>` : "";
  }
  $("tb").innerHTML = html || `<tr><td colspan="6" class="vazio">${q ? "Ninguém encontrado." : "Sem dados ainda."}</td></tr>`;
}

Promise.all([j("../data/ranking/oficial.json"), j("../data/ranking/completo.json")]).then(([o, c]) => {
  OF = o; CO = c;
  const tk = (o && o.ticket) || (c && c.ticket);
  $("sub").textContent = tk ? `Ticket do capítulo: ${tk}` + (o?.total ? ` · ${int(o.total)} coletados por todos os jogadores` : "") : "Ranking de tickets do capítulo";
  desenhar();
});
</script>
</body>
</html>
