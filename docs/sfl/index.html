<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SFL Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#0a0d13; --card:#131823; --line:#232b3a; --text:#eef1f6; --muted:#8d97a8; --acc:#2fc98a; }
  body.light { --bg:#f3f5f8; --card:#fff; --line:#e2e6ec; --text:#141821; --muted:#5e6776; --acc:#128a5c; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:Inter,-apple-system,"Segoe UI",sans-serif; padding:16px; box-sizing:border-box; }
  .card { max-width:520px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px; text-align:center; }
  h1 { margin:8px 0; font-size:24px; font-weight:800; } p { color:var(--muted); line-height:1.6; }
  a { color:var(--acc); font-weight:600; text-decoration:none; }
</style>
</head>
<body>
<div class="card">
  <div style="font-size:34px">💹</div>
  <h1>SFL Terminal</h1>
  <p>Em construção: compras e vendas de FLOWER ao vivo na Base e na Ronin, com a fazenda de cada carteira.</p>
  <p><a href="../">← Voltar ao início</a></p>
</div>
<script>try { if (localStorage.getItem("sfl_ban_tema") === "light") document.body.classList.add("light"); } catch {}</script>
</body>
</html>
